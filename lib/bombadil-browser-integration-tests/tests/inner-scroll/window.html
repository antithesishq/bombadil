<!DOCTYPE html>
<html>
  <head>
    <title>Scroller under the window's centre</title>
    <style>
      body { margin: 0; padding-top: 150px; }
      .list { height: 200px; margin: 0 100px 150px; overflow: auto; background: #eef; }
      button { display: block; width: 300px; height: 90px; margin: 10px; }
    </style>
  </head>
  <body>
    <!-- A wheel event at the centre of the window scrolls the list. -->
    <div class="list" data-scroller="list"></div>
    <div class="below"></div>
    <script src="oracle.js"></script>
    <script>
      addButtons(document.querySelector(".list"), "row", 3);
      addButtons(document.querySelector(".below"), "below", 2);
    </script>
  </body>
</html>
