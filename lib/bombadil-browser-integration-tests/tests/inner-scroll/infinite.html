<!DOCTYPE html>
<html>
  <head>
    <title>Infinite feed</title>
    <style>
      html, body { height: 100%; margin: 0; overflow: hidden; }
      .feed, .list { float: left; width: 340px; height: 300px; margin: 20px; overflow: auto; }
      .feed p { height: 100px; margin: 0; }
      button { display: block; width: 300px; height: 90px; margin: 10px; }
    </style>
  </head>
  <body>
    <!-- Never gets to its end. -->
    <div class="feed" data-scroller="feed"></div>
    <div class="list" data-scroller="list"></div>
    <script src="oracle.js"></script>
    <script>
      const feed = document.querySelector(".feed");
      let items = 0;
      function more() {
        for (let i = 0; i < 20; i++) {
          feed.appendChild(document.createElement("p")).textContent =
            `item ${items++}`;
        }
      }
      more();
      feed.addEventListener("scroll", () => {
        if (feed.scrollTop + feed.clientHeight >= feed.scrollHeight - 300) more();
      });
      addButtons(document.querySelector(".list"), "row", 6);
    </script>
  </body>
</html>
