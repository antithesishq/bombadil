<html>
  <head>
    <title>Scrolling frame</title>

      iframe { position: absolute; top: 100px; left: 200px; width: 400px; height: 400px; border: 5px solid gray; }
    </style>
  </head>
  <body>
    <iframe src="frame-inner.html" data-scroller="frame"></iframe>
    <script src="oracle.js"></script>
