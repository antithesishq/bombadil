<!DOCTYPE html>
<html>
<head><title>WebSocket conversation</title></head>
<body>

    <ul id="ws-conversation"></ul>

    <script>
    // A tiny "introduction" protocol over a bidirectional WebSocket:
    //
    //   server:  What's your name?:
    //   browser: My name is <Full_Name>       (randomly John Doe or Jane Doe)
    //   server:  Nice to meet you <Full_Name>
    //
    // Every message is appended to the #ws-conversation list as
    // "<who>: <text>", and the chosen name is exposed on the container as
    // data-name so the specification can check the greeting for that name.
    //
    // The WebSocket itself lives in a dedicated worker (worker.js). Bombadil
    // serves documents through DevTools (Fetch.fulfillRequest), so Chromium
    // cannot tell that this page came from a loopback address, and its Local
    // Network Access checks then block a WebSocket from the page to a local
    // server. A worker's address space comes from its own script response,
    // which is served directly, so the worker is allowed to connect.
    const names = ["John Doe", "Jane Doe"];
    const fullName = names[Math.floor(Math.random() * names.length)];

    const conversation = document.getElementById("ws-conversation");
    conversation.dataset.name = fullName;

    function log(who, text) {
        const item = document.createElement("li");
        item.className = who;
        item.textContent = `${who}: ${text}`;
        conversation.appendChild(item);
    }

    // The test server exposes the WebSocket endpoint at /ws (see
    // BrowserIntegrationTest::run in integration_tests.rs).
    const wsUrl = `ws://${location.host}/ws`;

    const worker = new Worker("worker.js");
    worker.onmessage = (event) => log(event.data.who, event.data.text);
    worker.onerror = (event) => log("browser", `worker error: ${event.message}`);
    worker.postMessage({ wsUrl, fullName });
    </script>
</body>
</html>
