<!DOCTYPE html>
<html>
  <head>
    <title>Console Error</title>
    <style>
      button {
        display: block;
        padding: 10px;
      }
    </style>
  </head>
  <body>
    <button id="a">A</button>

    <script>
      const button = document.querySelector("button");
      let count = 0;
      function reportTooMuch() {
        console.error("oh no you pressed too much\n    in Counter\n    in App");
      }
      function onPress() {
        count++;
        if (count >= 3) {
          reportTooMuch();
        }
      }
      button.addEventListener("click", onPress);
    </script>
  </body>
</html>
