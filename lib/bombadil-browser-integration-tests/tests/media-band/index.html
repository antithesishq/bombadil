<!DOCTYPE html>
<html>
<head>
    <title>Media Band Test</title>
    <style>
        @import "imported.css" (min-width: 300px);
        @media (min-width: 600px) { h1 { color: red; } }
        @supports (display: grid) {
            @media screen and (max-width: 600px) { h1 { margin: 0; } }
        }
        @media (max-width: 899px) { h1 { font-size: 1em; } }
        @layer base {
            @media (min-width: 75em) { h1 { color: blue; } }
        }
        main {
            container-type: inline-size;
            @media (width >= 1500px) { padding: 1px; }
        }
        @container (min-width: 100px) { h1 { padding: 0; } }
    </style>
    <style media="(min-width: 1800px)">
        h1 { color: green; }
    </style>
</head>
<body>
    <main>
        <h1>Media Band Test</h1>
    </main>
</body>
</html>
