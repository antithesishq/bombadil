name: Setup Nix
description: >
  Install Nix via nix-quick-install, restore /nix/store from the GitHub
  Actions cache, and (on main only) configure cachix for pushing.

inputs:
  scope:
    description: >
      Cache scope. Use a distinct value per job/closure so parallel jobs
      don't overwrite or purge each other's caches (e.g. "build-x86_64-linux",
      "npm-package", "manual").
    required: true
  cachix-auth-token:
    description: >
      Cachix auth token. When present (same-repo PRs, main pushes, tags),
      the job pushes built paths to cachix as a post-step. Fork PRs don't
      receive secrets, so the token is empty and the push step is skipped;
      forks still read cachix as a substituter via flake.nix's nixConfig.
    required: false

runs:
  using: composite
  steps:
    - uses: nixbuild/nix-quick-install-action@v34
      with:
        nix_conf: |
          experimental-features = nix-command flakes
          accept-flake-config = true

    - uses: nix-community/cache-nix-action@v6
      with:
        primary-key: nix-${{ runner.os }}-${{ runner.arch }}-${{ inputs.scope }}-${{ hashFiles('**/flake.lock', '**/Cargo.lock') }}
        restore-prefixes-first-match: nix-${{ runner.os }}-${{ runner.arch }}-${{ inputs.scope }}-
        gc-max-store-size-linux: 5G
        gc-max-store-size-macos: 5G
        purge: true
        purge-prefixes: nix-${{ runner.os }}-${{ runner.arch }}-${{ inputs.scope }}-
        purge-created: 0
        purge-primary-key: never

    - if: inputs.cachix-auth-token != ''
      uses: cachix/cachix-action@v15
      with:
        name: bombadil
        authToken: ${{ inputs.cachix-auth-token }}
