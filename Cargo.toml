[workspace]
members = [
    "lib/antithesis-fuzzer",
    "lib/bombadil",
    "lib/bombadil-browser",
    "lib/bombadil-browser-integration-tests",
    "lib/bombadil-browser-keys",
    "lib/bombadil-cli",
    "lib/bombadil-ltl",
    "lib/bombadil-inspect",
    "lib/bombadil-schema",
    "lib/bombadil-terminal",
    "lib/cdp",
    "lib/cdp/types",
    "lib/cdp/pdl",
    "lib/cdp/protocol",
    "lib/small-string",
    "lib/typescript-reference",
    "lib/willow-tree",
]
resolver = "2"

[workspace.package]
version = "0.7.2"
edition = "2024"

[workspace.dependencies]
antithesis_sdk = { version = "0.2.9", default-features = false, features = ["rand_v0_10", "full"] }
anyhow = "1.0.99"
axum = "0.8.8"
base64 = "0.22.1"
bitflags = "2.12.1"
boa_engine = { git = "https://github.com/boa-dev/boa", rev = "8a3ca7d0978ffadf165989ad0a9a93a6cafd61b4" }
bytes = "1.11.0"
clap = { version = "4.5.46", features = ["derive"] }
const_format = "0.2.35"
crossbeam-channel = "0.5" # for mpmc, could probably be dropped when this goes into stable std
env_logger = "0.11.8"
futures = "0.3.31"
glob = "0.3.3"
gloo-console = "0.3"
gloo-net = "0.6"
gloo-timers = "0.3"
hegeltest = "0.21.2"
hotpath = "0.16.1"
html5ever = "0.39"
http = "1.4.0"
http-body-util = "0.1.3"
include_dir = "0.7.4"
indoc = "2.0.7"
insta = "1.43.1"
js-sys = "0.3"
libghostty-vt = "0.2.0"
log = "0.4.29"
mime_guess = "2.0"
num-traits = "0.2"
open = "5.0"
oxc = { version =  "0.125.0", features = ["codegen", "semantic", "transformer"] }
oxc_resolver = "11.19.1"
oxc_codegen = "0.125.0"
oxc_str = "0.125.0"
oxc_traverse = "0.125.0"
owo-colors = "4.3.0"
portable-pty = "0.9.0"
rand = "0.10.1"
rand_chacha = "0.10.0"
rand_distr = "0.6"
rand_regex = "0.19"
regex = "1.12"
regex-syntax = "0.8"
scraper = "0.27.0"
serde = "1.0.228"
serde_json = "1.0.145"
supports-color = "3.0.2"
tempfile = "3.22.0"
tokio = "1.48.0"
tokio-stream = "0.1.17"
tower = "0.5.2"
tower-http = "0.6.8"
tungstenite = "0.30.0"
url = "2.5.7"
wasm-bindgen = "=0.2.121"
wasm-bindgen-futures = "0.4"
web-sys = "0.3"
yew = "0.23"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
